<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion}">Formulario Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/libros}"><i class="bi bi-book-half me-2"></i>BiblioTrack</a>
    </div>
</nav>

<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 fs-5" th:text="${accion}"></h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-semibold">Título del Libro</label>
                            <input type="text" class="form-control" id="titulo" th:field="*{titulo}" 
                                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid' : ''" 
                                   placeholder="Ej. Indigno de ser humano">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="autor" class="form-label fw-semibold">Autor</label>
                                <input type="text" class="form-control" id="autor" th:field="*{autor}"
                                       th:classappend="${#fields.hasErrors('autor')} ? 'is-invalid' : ''" 
                                       placeholder="Ej. Osamu Dazai">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="genero" class="form-label fw-semibold">Género / Categoría</label>
                                <input type="text" class="form-control" id="genero" th:field="*{genero}"
                                       th:classappend="${#fields.hasErrors('genero')} ? 'is-invalid' : ''" 
                                       placeholder="Ej. Ficción">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="paginas" class="form-label fw-semibold">Páginas</label>
                                <input type="number" class="form-control" id="paginas" th:field="*{paginas}"
                                       th:classappend="${#fields.hasErrors('paginas')} ? 'is-invalid' : ''" 
                                       placeholder="100">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('paginas')}" th:errors="*{paginas}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="estado" class="form-label fw-semibold">Estado de Lectura</label>
                                <select class="form-select" id="estado" th:field="*{estado}"
                                        th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid' : ''">
                                    <option value="">Selecciona...</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Leyendo">Leyendo</option>
                                    <option value="Leído">Leído</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="calificacion" class="form-label fw-semibold">Calificación</label>
                                <select class="form-select" id="calificacion" th:field="*{calificacion}"
                                        th:classappend="${#fields.hasErrors('calificacion')} ? 'is-invalid' : ''">
                                    <option value="">Nota...</option>
                                    <option value="1">1 Estrella</option>
                                    <option value="2">2 Estrellas</option>
                                    <option value="3">3 Estrellas</option>
                                    <option value="4">4 Estrellas</option>
                                    <option value="5">5 Estrellas</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('calificacion')}" th:errors="*{calificacion}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/libros}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
