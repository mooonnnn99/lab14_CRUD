<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/libros}"><i class="bi bi-book-half me-2"></i>BiblioTrack</a>
    </div>
</nav>

<div class="container py-2">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold text-dark mb-0">Catálogo de Libros</h2>
        <a th:href="@{/libros/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-lg me-1"></i> Registrar Libro
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Género</th>
                            <th>Páginas</th>
                            <th>Estado</th>
                            <th>Calificación</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(libros)}">
                            <td colspan="8" class="text-center py-4 text-muted">
                                <i class="bi bi-journal-x fs-2 d-block mb-1"></i>Aún no has registrado ningún libro.
                            </td>
                        </tr>
                        <tr th:each="libro : ${libros}">
                            <td class="ps-3 fw-bold" th:text="${libro.id}"></td>
                            <td class="fw-semibold text-primary" th:text="${libro.titulo}"></td>
                            <td th:text="${libro.autor}"></td>
                            <td th:text="${libro.genero}"></td>
                            <td th:text="${libro.paginas + ' págs.'}"></td>
                            <td>
                                <span th:if="${libro.estado == 'Leído'}" class="badge bg-success" th:text="${libro.estado}"></span>
                                <span th:if="${libro.estado == 'Leyendo'}" class="badge bg-primary" th:text="${libro.estado}"></span>
                                <span th:if="${libro.estado == 'Pendiente'}" class="badge bg-warning text-dark" th:text="${libro.estado}"></span>
                            </td>
                            <td>
                                <span class="text-warning">
                                    <i th:each="i : ${#numbers.sequence(1, libro.calificacion)}" class="bi bi-star-fill"></i>
                                </span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/libros/detalle/{id}(id=${libro.id})}" class="btn btn-outline-info" title="Ver Detalle">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/libros/editar/{id}(id=${libro.id})}" class="btn btn-outline-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}" class="btn btn-outline-danger" 
                                       onclick="return confirm('¿Seguro que deseas eliminar este libro?');" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
