<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha del Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/libros}"><i class="bi bi-book-half me-2"></i>BiblioTrack</a>
    </div>
</nav>

<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-card-heading me-2"></i>Ficha del Libro</h5>
                    <span class="badge bg-secondary" th:text="'ID: ' + ${libro.id}"></span>
                </div>
                <div class="card-body p-4">
                    <h3 class="card-title text-dark fw-bold mb-1" th:text="${libro.titulo}"></h3>
                    <p class="text-muted fst-italic mb-3" th:text="'Por ' + ${libro.autor}"></p>
                    
                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-bookmark me-2"></i>Género:</span>
                            <span class="fw-semibold" th:text="${libro.genero}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-file-earmark-text me-2"></i>Páginas:</span>
                            <span class="fw-semibold" th:text="${libro.paginas + ' páginas'}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-hourglass-split me-2"></i>Estado:</span>
                            <span>
                                <span th:if="${libro.estado == 'Leído'}" class="badge bg-success" th:text="${libro.estado}"></span>
                                <span th:if="${libro.estado == 'Leyendo'}" class="badge bg-primary" th:text="${libro.estado}"></span>
                                <span th:if="${libro.estado == 'Pendiente'}" class="badge bg-warning text-dark" th:text="${libro.estado}"></span>
                            </span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-star me-2"></i>Calificación:</span>
                            <span>
                                <span class="text-warning">
                                    <i th:each="i : ${#numbers.sequence(1, libro.calificacion)}" class="bi bi-star-fill"></i>
                                </span>
                                <span class="fw-semibold ms-1" th:text="${libro.calificacion + ' / 5'}"></span>
                            </span>
                        </li>
                    </ul>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/libros}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver a la lista
                        </a>
                        <a th:href="@{/libros/editar/{id}(id=${libro.id})}" class="btn btn-warning">
                            <i class="bi bi-pencil-square me-1"></i> Editar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
